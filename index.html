<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="./script.js" defer></script>

<body>
    <h2 class="verses-title">Johnny vs Joey</h2>
    <dialog id="myModal">
        <div class="modal-header">
            <h2>Tic Tac Toe</h2>
            <button class="close-btn" id="closeModal">&times;</button>
        </div>
        <form id="modal-form" action="" method="POST">

            <div class="player-names">
                <div>
                    <label for="player1">Player 1 Name:</label>
                    <label for="player2">Player 2 Name:</label>
                </div>
                <div>
                    <input type="text" id="player1" name="name" placeholder="Johnny" required autofocus>
                    <input type="text" id="player2" name="name" placeholder="Joey" required>
                </div>
            </div>
            
            <div>
                <button class="start-game-btn" type="button">Start Game</button>
            </div>

        </form>
    </dialog>
    <div class="reset-btn-gameBoard-space">
        <div class="left-space">
            <button class="reset-game-btn" type="button">Reset Game</button>
        </div>
        <div id="gameBoard">
            <!-- <div class="square-row">
                <div id="square1" class="square"></div>

                <div id="square3" class="square"></div>
            </div>
            <div class="square-row">
                <div id="square4" class="square"></div>
                <div id="square5" class="square"></div>
                <div id="square6" class="square"></div>
            </div>
            <div class="square-row">

                <div id="square9" class="square"></div>
            </div> -->

        <div class="right-space"></div>
    </div>
</body>
</html>
